parameters:
  - name: stageName
    type: string
    default: AppDeployment
  - name: dependsOn
    type: object
    default: []
  - name: environment_choice
    type: string
    default: dev
  - name: processName
    type: string
  - name: functionRuntime
    type: string
    default: node
  - name: nodeVersion
    type: string
    default: '24'
  - name: pythonVersion
    type: string
    default: '3.14'
  - name: azureServiceConnection
    type: string
  - name: stageVariables
    type: object
    default: {}

stages:
  - stage: ${{ parameters.stageName }}
    displayName: 'Validate & Deploy: ${{ parameters.processName }} (${{ parameters.environment_choice }})'
    dependsOn: ${{ parameters.dependsOn }}
    variables:
      codeSourceDirectory: '$(Build.SourcesDirectory)/LambdaLoaders/${{ parameters.processName }}/functionCode'
      ${{ insert }}: ${{ parameters.stageVariables }}
    jobs:
      - job: validate
        displayName: Validate Function App code
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self

          - bash: |
              set -euo pipefail
              if [ ! -d "$(codeSourceDirectory)" ]; then
                echo "##vso[task.logissue type=error]Code source directory does not exist: $(codeSourceDirectory)"
                exit 1
              fi
            displayName: Validate Code Source Directory

          - ${{ if eq(parameters.functionRuntime, 'python') }}:
            - task: UsePythonVersion@0
              displayName: Use Python ${{ parameters.pythonVersion }}
              inputs:
                versionSpec: '${{ parameters.pythonVersion }}'

            - bash: |
                set -euo pipefail
                python -m pip install --upgrade pip
                [ -f requirements.txt ] && pip install -r requirements.txt
                [ -f requirements-test.txt ] && pip install -r requirements-test.txt
                echo "Dependencies installed."
              displayName: Install Python Dependencies
              workingDirectory: '$(codeSourceDirectory)'

            - bash: |
                set -euo pipefail
                if [ ! -f host.json ]; then
                  echo "##vso[task.logissue type=error]Python Function App source is missing host.json."
                  exit 1
                fi
                # Byte-compile every Python file to catch syntax errors early.
                find . -name '*.py' -not -path './.venv/*' -not -path '*/__pycache__/*' \
                  -exec python -m py_compile {} +
                echo "Structure and lint checks passed."
              displayName: Validate Structure and Lint
              workingDirectory: '$(codeSourceDirectory)'

          - ${{ if eq(parameters.functionRuntime, 'node') }}:
            - task: NodeTool@0
              displayName: Use Node.js $(nodeVersion)
              inputs:
                versionSpec: '$(nodeVersion)'

            - bash: |
                set -euo pipefail
                for required_file in host.json package.json; do
                  if [ ! -f "${required_file}" ]; then
                    echo "##vso[task.logissue type=error]Node.js Function App source is missing ${required_file}."
                    exit 1
                  fi
                done
                if [ -f package-lock.json ]; then npm ci; else npm install; fi
                npm run build --if-present
                echo "Structure check and build passed."
              displayName: Validate Structure and Build
              workingDirectory: '$(codeSourceDirectory)'

      - deployment: deploy
        displayName: Publish Function App code
        dependsOn: validate
        condition: succeeded()
        environment: ${{ parameters.environment_choice }}
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - bash: |
                    set -euo pipefail
                    for value in "${FUNCTION_APP_NAME}"; do
                      case "${value}" in
                        ""|'$('*)
                          echo "##vso[task.logissue type=error]functionAppName is required."
                          exit 1
                          ;;
                      esac
                    done
                  displayName: Validate Deployment Inputs
                  env:
                    FUNCTION_APP_NAME: '$(functionAppName)'

                - ${{ if eq(parameters.functionRuntime, 'python') }}:
                  - task: UsePythonVersion@0
                    displayName: Use Python ${{ parameters.pythonVersion }}
                    inputs:
                      versionSpec: '${{ parameters.pythonVersion }}'

                # Node.js is required to install Azure Functions Core Tools even for Python apps.
                - task: NodeTool@0
                  displayName: Use Node.js $(nodeVersion)
                  inputs:
                    versionSpec: '$(nodeVersion)'

                - bash: |
                    set -euo pipefail
                    npm install -g azure-functions-core-tools@4 --unsafe-perm true
                    echo "Installed func version:"
                    func --version
                  displayName: Install Azure Functions Core Tools v4

                - template: network-allow-agent.yml
                  parameters:
                    azureServiceConnection: '${{ parameters.azureServiceConnection }}'

                - task: AzureCLI@2
                  displayName: 'Allow agent IP on Function App'
                  inputs:
                    azureSubscription: '${{ parameters.azureServiceConnection }}'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      AGENT_IP=$(curl -s --retry 3 https://api.ipify.org)
                      echo "Agent public IP: ${AGENT_IP}"

                      FUNC_RG="${FUNCTION_APP_RESOURCE_GROUP}"
                      if [ -z "${FUNC_RG}" ]; then
                        FUNC_RG=$(az functionapp show \
                          --name "${FUNCTION_APP_NAME}" \
                          --query "resourceGroup" -o tsv 2>/dev/null || true)
                      fi

                      if [ -z "${FUNC_RG}" ]; then
                        echo "##vso[task.logissue type=warning]Could not resolve resource group for ${FUNCTION_APP_NAME}; skipping access restriction."
                        exit 0
                      fi

                      echo "Adding ${AGENT_IP} to Function App ${FUNCTION_APP_NAME} access restrictions..."
                      az functionapp config access-restriction add \
                        --name "${FUNCTION_APP_NAME}" \
                        --resource-group "${FUNC_RG}" \
                        --rule-name "PipelineAgent" \
                        --action Allow \
                        --ip-address "${AGENT_IP}/32" \
                        --priority 100 \
                        --only-show-errors || true

                      echo "Waiting 15 seconds for access restriction to propagate..."
                      sleep 15
                  env:
                    FUNCTION_APP_NAME: '$(functionAppName)'
                    FUNCTION_APP_RESOURCE_GROUP: '$(functionAppResourceGroup)'

                - task: AzureCLI@2
                  displayName: Deploy ${{ parameters.functionRuntime }} Function App (remote build)
                  inputs:
                    azureSubscription: '${{ parameters.azureServiceConnection }}'
                    scriptType: bash
                    scriptLocation: inlineScript
                    workingDirectory: '$(codeSourceDirectory)'
                    inlineScript: |
                      set -euo pipefail

                      if [ "${RUNTIME}" = "python" ]; then
                        runtime_flag="--python"
                      else
                        runtime_flag="--javascript"
                      fi

                      echo "Publishing ${FUNCTION_APP_NAME} with a remote build..."
                      func azure functionapp publish "${FUNCTION_APP_NAME}" \
                        ${runtime_flag} --build remote --force
                  env:
                    FUNCTION_APP_NAME: '$(functionAppName)'
                    RUNTIME: '${{ parameters.functionRuntime }}'

                - task: AzureCLI@2
                  displayName: Verify Deployment
                  inputs:
                    azureSubscription: '${{ parameters.azureServiceConnection }}'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      plan=$(az functionapp show \
                        --name "${FUNCTION_APP_NAME}" \
                        --resource-group "${FUNCTION_APP_RESOURCE_GROUP}" \
                        --query "sku.name" -o tsv 2>/dev/null || echo "Unknown")
                      echo "Detected hosting plan: ${plan:-Unknown}"

                      if [ "${plan}" = "ElasticPremium" ]; then
                        for attempt in $(seq 1 12); do
                          state=$(az functionapp show \
                            --name "${FUNCTION_APP_NAME}" \
                            --resource-group "${FUNCTION_APP_RESOURCE_GROUP}" \
                            --query "state" -o tsv 2>/dev/null || echo "Unknown")
                          echo "Attempt ${attempt}/12: state = ${state:-Unknown}"
                          [ "${state}" = "Running" ] && { echo "Function App is running."; exit 0; }
                          sleep 30
                        done
                        echo "##vso[task.logissue type=error]Function App did not reach Running state."
                        exit 1
                      else
                        echo "Flex Consumption / other plan detected; skipping runtime state polling."
                      fi
                  env:
                    FUNCTION_APP_NAME: '$(functionAppName)'
                    FUNCTION_APP_RESOURCE_GROUP: '$(functionAppResourceGroup)'

                - task: AzureCLI@2
                  displayName: 'Remove agent IP from Function App'
                  condition: always()
                  inputs:
                    azureSubscription: '${{ parameters.azureServiceConnection }}'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      AGENT_IP=$(curl -s --retry 3 https://api.ipify.org)

                      FUNC_RG="${FUNCTION_APP_RESOURCE_GROUP}"
                      if [ -z "${FUNC_RG}" ]; then
                        FUNC_RG=$(az functionapp show \
                          --name "${FUNCTION_APP_NAME}" \
                          --query "resourceGroup" -o tsv 2>/dev/null || true)
                      fi

                      if [ -z "${FUNC_RG}" ]; then
                        echo "Could not resolve resource group; skipping removal."
                        exit 0
                      fi

                      echo "Removing agent IP ${AGENT_IP} from Function App access restrictions..."
                      az functionapp config access-restriction remove \
                        --name "${FUNCTION_APP_NAME}" \
                        --resource-group "${FUNC_RG}" \
                        --rule-name "PipelineAgent" \
                        --only-show-errors || true

                      echo "Agent IP removed from Function App."
                  env:
                    FUNCTION_APP_NAME: '$(functionAppName)'
                    FUNCTION_APP_RESOURCE_GROUP: '$(functionAppResourceGroup)'

                - template: network-deny-agent.yml
                  parameters:
                    azureServiceConnection: '${{ parameters.azureServiceConnection }}'