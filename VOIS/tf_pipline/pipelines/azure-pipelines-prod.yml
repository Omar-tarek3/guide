# Azure DevOps Pipeline for Azure Function Terraform Deployment
# Staging-branch deployment workflow for dev and prod environments
#
# Prerequisites:
#   1. Service connections 'sc-robotics-test' and 'azure-prod-sc' are authorized for this pipeline
#   2. Azure DevOps Environments 'funcapp-dev' and 'funcapp-prod' exist
#   3. Agent pool with Terraform, Python 3.8+, Node.js 18+, Azure Functions Core Tools v4
#   4. Variable group 'VFGTVOIS-CDK' linked to the pipeline (contains GitHub_token for pull request creation)
#
# Each process lives under LambdaLoaders/<processName>/ with:
#   config/<dev|prod>/process_config.xlsx   — environment configuration
#   functionCode/                           — function app source code
#   tfvars/<dev|prod>/terraform.tfvars      — generated by this pipeline

parameters:
  - name: processName
    displayName: 'Process folder name (e.g. process-name)'
    type: string
  - name: deploymentEnvironment
    displayName: 'Deployment environment'
    type: string
    default: dev
    values:
      - dev
      - prod
  - name: functionRuntime
    displayName: 'Azure Function runtime'
    type: string
    default: node
    values:
      - node
      - python
  - name: nodeVersion
    displayName: 'Node.js version for function code deployment'
    type: string
    default: '24'
    values:
      - 'NA'
      - '22'
      - '24'
  - name: IssueID
    displayName: 'Optional Redmine issue ID'
    type: string
    default: ''

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - name: rootDir
    value: '$(System.DefaultWorkingDirectory)/LambdaLoaders'
  - name: processDir
    value: '$(System.DefaultWorkingDirectory)/LambdaLoaders/${{ parameters.processName }}'
  - name: terraformDir
    value: '$(System.DefaultWorkingDirectory)/LambdaLoaders/terraform'
  - name: scriptsDir
    value: '$(System.DefaultWorkingDirectory)/LambdaLoaders/scripts'
  - name: configFile
    value: '$(processDir)/config/${{ parameters.deploymentEnvironment }}/process_config.xlsx'
  - name: generatedTfvars
    value: '$(processDir)/tfvars/${{ parameters.deploymentEnvironment }}/terraform.tfvars'
  - name: terraformVersion
    value: '1.9.0'
  - name: pythonVersion
    value: '3.14'
  - name: terraformStateResourceGroup
    value: 'rg-azugwc-90012-tfstate-dev-001'
  - name: terraformStateStorageAccount
    value: 'saazugwc90012statedev001'
  - name: terraformStateContainer
    value: 'tfstate'
  - name: TF_IN_AUTOMATION
    value: 'true'
  - name: TF_INPUT
    value: 'false'
  - name: TF_PLUGIN_CACHE_DIR
    value: '$(Pipeline.Workspace)/.terraform.d/plugin-cache'

stages:

# ==========================================
#  Stage 1: Generate tfvars & push to branch
# ==========================================
- stage: Validate
  displayName: 'Generate & Validate Configuration'
  jobs:
  - job: GenerateTfvars
    displayName: 'Generate terraform.tfvars from xlsx config'
    steps:

    - checkout: self
      persistCredentials: true

    # - bash: |
    #     set -euo pipefail
    #     EXPECTED_BRANCH="refs/heads/staging"
    #     if [ "$(Build.SourceBranch)" != "$EXPECTED_BRANCH" ]; then
    #       echo "##vso[task.logissue type=error]Run this deployment pipeline from 'staging'. Current branch: $(Build.SourceBranch)"
    #       exit 1
    #     fi
    #   displayName: 'Validate source branch'

    - task: UsePythonVersion@0
      displayName: 'Use Python $(pythonVersion)'
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        pip install -r $(scriptsDir)/requirements.txt
      displayName: 'Install Python dependencies'

    - script: |
        set -euo pipefail

        CONFIG_FILE="$(configFile)"
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "##vso[task.logissue type=error]Config file not found: $CONFIG_FILE"
          exit 1
        fi

        # Create tfvars output directory if needed
        mkdir -p "$(processDir)/tfvars/${{ parameters.deploymentEnvironment }}"

        python $(scriptsDir)/generate_tfvars.py \
          --input "$CONFIG_FILE" \
          --output "$(generatedTfvars)"
      displayName: 'Generate terraform.tfvars from xlsx'

    - script: |
        echo "=== Generated terraform.tfvars ==="
        cat "$(generatedTfvars)"
      displayName: 'Display generated tfvars'

    # Extract process_name and function_app_name from generated tfvars
    - script: |
        set -euo pipefail
        TFVARS="$(generatedTfvars)"

        FUNC_NAME=$(grep 'function_app_name' "$TFVARS" | sed 's/.*= "\(.*\)"/\1/')
        PROCESS_NAME=$(grep '^process_name' "$TFVARS" | sed 's/.*= "\(.*\)"/\1/')
        NODE_VERSION=$(grep 'node_version' "$TFVARS" | sed 's/.*= "\(.*\)"/\1/')
        RESOURCE_GROUP_NAME=$(grep '^resource_group_name' "$TFVARS" | sed 's/.*= "\(.*\)"/\1/')
        CONFIG_ENVIRONMENT=$(grep '^environment' "$TFVARS" | sed 's/.*= "\(.*\)"/\1/' | tr '[:upper:]' '[:lower:]')

        case '${{ parameters.deploymentEnvironment }}' in
          dev)
            if [ "$CONFIG_ENVIRONMENT" != "dev" ] && [ "$CONFIG_ENVIRONMENT" != "development" ]; then
              echo "##vso[task.logissue type=error]Selected deployment environment is dev, but process configuration environment is '$CONFIG_ENVIRONMENT'."
              exit 1
            fi
            ;;
          prod)
            if [ "$CONFIG_ENVIRONMENT" != "prod" ] && [ "$CONFIG_ENVIRONMENT" != "production" ]; then
              echo "##vso[task.logissue type=error]Selected deployment environment is prod, but process configuration environment is '$CONFIG_ENVIRONMENT'."
              exit 1
            fi
            ;;
        esac

        echo "##vso[task.setvariable variable=functionAppName;isOutput=true]$FUNC_NAME"
        echo "##vso[task.setvariable variable=functionAppResourceGroup;isOutput=true]$RESOURCE_GROUP_NAME"
        echo "##vso[task.setvariable variable=processName;isOutput=true]$PROCESS_NAME"
        echo "##vso[task.setvariable variable=nodeVersion;isOutput=true]$NODE_VERSION"

        echo "Function App Name: $FUNC_NAME"
        echo "Function App Resource Group: $RESOURCE_GROUP_NAME"
        echo "Process Name: $PROCESS_NAME"
        echo "Node Version: $NODE_VERSION"
        echo "Deployment Environment: ${{ parameters.deploymentEnvironment }}"
      displayName: 'Extract variables from tfvars'
      name: extractVars

    - script: |
        set -euo pipefail

        cd $(System.DefaultWorkingDirectory)

        SOURCE_BRANCH=$(echo "$(Build.SourceBranch)" | sed 's|refs/heads/||')
        BRANCH_NAME="feature/azure-pipelines/generated-tfvars-${{ parameters.processName }}"
        echo "Creating branch '$BRANCH_NAME' from '$SOURCE_BRANCH'"

        git config user.email "azure-pipelines@local"
        git config user.name "Azure Pipelines"

        git checkout -b "$BRANCH_NAME"

        # Ensure process folder structure exists
        mkdir -p "LambdaLoaders/${{ parameters.processName }}/config"
        mkdir -p "LambdaLoaders/${{ parameters.processName }}/reference"
        mkdir -p "LambdaLoaders/${{ parameters.processName }}/tfvars/${{ parameters.deploymentEnvironment }}"

        git add "LambdaLoaders/${{ parameters.processName }}/tfvars/${{ parameters.deploymentEnvironment }}/terraform.tfvars"
        git add "LambdaLoaders/${{ parameters.processName }}/reference/reference.txt"

        TFVARS_CHANGED=false
        if git diff --cached --quiet; then
          echo "No changes detected in terraform.tfvars; skipping commit."
        else
          git commit -m "chore(${{ parameters.deploymentEnvironment }}): generate terraform.tfvars for ${{ parameters.processName }} [skip ci]"
          TFVARS_CHANGED=true
        fi

        git push --force origin "HEAD:$BRANCH_NAME"
        echo "##vso[task.setvariable variable=generatedBranch;isOutput=true]$BRANCH_NAME"
        echo "##vso[task.setvariable variable=tfvarsChanged;isOutput=true]$TFVARS_CHANGED"
        echo "Branch pushed: $BRANCH_NAME"
      displayName: 'Create branch & push generated tfvars'
      name: pushTfvarsBranch

    - publish: $(generatedTfvars)
      artifact: tfvars
      displayName: 'Publish tfvars artifact'

# ==========================================
#  Stage 2: Terraform Plan
# ==========================================
- template: templates/plan.yml
  parameters:
    componentName: '${{ parameters.processName }}'
    stageName: Plan
    dependsOn:
      - Validate
    action: apply
    ${{ if eq(parameters.deploymentEnvironment, 'dev') }}:
      azureServiceConnection: 'sc-id-azugwc-mcs-awsmigrate-gwc-level3'
    ${{ if eq(parameters.deploymentEnvironment, 'prod') }}:
      azureServiceConnection: 'azure-prod-sc'
    terraformVersion: '$(terraformVersion)'
    workingDirectory: '$(terraformDir)'
    stateResourceGroup: '$(terraformStateResourceGroup)'
    stateStorageAccount: '$(terraformStateStorageAccount)'
    stateContainer: '$(terraformStateContainer)'
    stateKey: 'uipath-lambda-loaders-state/$(functionAppName).terraform.tfstate'
    tfvarsFile: '$(terraformDir)/terraform.tfvars'
    planFileName: tfplan
    artifactName: terraform-plan
    additionalPlanArguments:
      - '-var=function_runtime=${{ parameters.functionRuntime }}'
      - '-var=python_version=$(pythonVersion)'
    stageVariables:
      functionAppName: $[ stageDependencies.Validate.GenerateTfvars.outputs['extractVars.functionAppName'] ]
      ${{ if eq(parameters.deploymentEnvironment, 'dev') }}:
        webjobsStorageAccountName: 'stgwclamlodev001'
        webjobsStorageAccountResourceGroup: 'rg-azugwc-90012-sa-dev-001'
        globalKeyVaultName: 'kvgwcuipathdev001'
        globalKeyVaultResourceGroup: 'rg-azugwc-90012-kv-dev-001'
        localKeyVaultName: 'kvgwclamlodev001'
        localKeyVaultResourceGroup: 'rg-azugwc-90012-kv-dev-001'
      ${{ if eq(parameters.deploymentEnvironment, 'prod') }}:
        webjobsStorageAccountName: 'stgwclamloprod001'
        webjobsStorageAccountResourceGroup: 'rg-azugwc-90012-sa-prod-001'
        globalKeyVaultName: 'kvgwcuipathprod001'
        globalKeyVaultResourceGroup: 'rg-azugwc-90012-kv-prod-001'
        localKeyVaultName: 'kvgwclamloprod001'
        localKeyVaultResourceGroup: 'rg-azugwc-90012-kv-prod-001'
    preValidateSteps:
      - download: current
        artifact: tfvars
        displayName: 'Download tfvars'
      - script: |
          cp $(Pipeline.Workspace)/tfvars/terraform.tfvars $(terraformDir)/terraform.tfvars
        displayName: 'Copy tfvars to terraform dir'

# ==========================================
#  Stage 3: Wait for Apply Approval
# ==========================================
- stage: ApplyApproval
  displayName: 'Approve Terraform Apply'
  dependsOn: Plan
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
    - job: WaitForApproval
      displayName: 'Review tfplan and approve deployment'
      pool: server
      timeoutInMinutes: 1440
      steps:
        - task: ManualValidation@0
          timeoutInMinutes: 1440
          inputs:
            notifyUsers: ''
            instructions: 'Review the terraform-plan pipeline artifact and Plan stage output. Resume to apply the reviewed plan, deploy the function code, and create the generated tfvars PR.'
            onTimeout: reject

# ==========================================
#  Stage 4: Terraform Apply
# ==========================================
- template: templates/apply.yml
  parameters:
    componentName: '${{ parameters.processName }}'
    stageName: Apply
    dependsOn:
      - Validate
      - Plan
      - ApplyApproval
    action: apply
    ${{ if eq(parameters.deploymentEnvironment, 'dev') }}:
      azureServiceConnection: 'sc-id-azugwc-mcs-awsmigrate-gwc-level3'
    ${{ if eq(parameters.deploymentEnvironment, 'prod') }}:
      azureServiceConnection: 'azure-prod-sc'
    terraformVersion: '$(terraformVersion)'
    workingDirectory: '$(terraformDir)'
    stateResourceGroup: '$(terraformStateResourceGroup)'
    stateStorageAccount: '$(terraformStateStorageAccount)'
    stateContainer: '$(terraformStateContainer)'
    stateKey: 'uipath-lambda-loaders-state/$(functionAppName).terraform.tfstate'
    planFileName: tfplan
    artifactName: terraform-plan
    stageVariables:
      functionAppName: $[ stageDependencies.Validate.GenerateTfvars.outputs['extractVars.functionAppName'] ]
      ${{ if eq(parameters.deploymentEnvironment, 'dev') }}:
        webjobsStorageAccountName: 'stgwclamlodev001'
        webjobsStorageAccountResourceGroup: 'rg-azugwc-90012-sa-dev-001'
        globalKeyVaultName: 'kvgwcuipathdev001'
        globalKeyVaultResourceGroup: 'rg-azugwc-90012-kv-dev-001'
        localKeyVaultName: 'kvgwclamlodev001'
        localKeyVaultResourceGroup: 'rg-azugwc-90012-kv-dev-001'
      ${{ if eq(parameters.deploymentEnvironment, 'prod') }}:
        webjobsStorageAccountName: 'stgwclamloprod001'
        webjobsStorageAccountResourceGroup: 'rg-azugwc-90012-sa-prod-001'
        globalKeyVaultName: 'kvgwcuipathprod001'
        globalKeyVaultResourceGroup: 'rg-azugwc-90012-kv-prod-001'
        localKeyVaultName: 'kvgwclamloprod001'
        localKeyVaultResourceGroup: 'rg-azugwc-90012-kv-prod-001'

# ==========================================
#  Stage 5: Deploy Function Code
# ==========================================
- template: templates/app-deployment.yml
  parameters:
    stageName: AppDeployment
    environment_choice: '${{ parameters.deploymentEnvironment }}'
    processName: '${{ parameters.processName }}'
    functionRuntime: '${{ parameters.functionRuntime }}'
    ${{ if and(eq(parameters.functionRuntime, 'python'), eq(parameters.nodeVersion, 'NA')) }}:
      nodeVersion: '24'
    ${{ else }}:
      nodeVersion: '${{ parameters.nodeVersion }}'
    pythonVersion: '$(pythonVersion)'
    dependsOn:
      - Validate
      - Apply
    ${{ if eq(parameters.deploymentEnvironment, 'dev') }}:
      azureServiceConnection: 'sc-id-azugwc-mcs-awsmigrate-gwc-level3'
    ${{ if eq(parameters.deploymentEnvironment, 'prod') }}:
      azureServiceConnection: 'azure-prod-sc'
    stageVariables:
      functionAppName: $[ stageDependencies.Validate.GenerateTfvars.outputs['extractVars.functionAppName'] ]
      functionAppResourceGroup: $[ stageDependencies.Validate.GenerateTfvars.outputs['extractVars.functionAppResourceGroup'] ]
      ${{ if and(eq(parameters.functionRuntime, 'python'), eq(parameters.nodeVersion, 'NA')) }}:
        nodeVersion: '24'
      ${{ else }}:
        nodeVersion: '${{ parameters.nodeVersion }}'
      ${{ if eq(parameters.deploymentEnvironment, 'dev') }}:
        webjobsStorageAccountName: 'stgwclamlodev001'
        webjobsStorageAccountResourceGroup: 'rg-azugwc-90012-sa-dev-001'
        globalKeyVaultName: 'kvgwcuipathdev001'
        globalKeyVaultResourceGroup: 'rg-azugwc-90012-kv-dev-001'
        localKeyVaultName: 'kvgwclamlodev001'
        localKeyVaultResourceGroup: 'rg-azugwc-90012-kv-dev-001'
      ${{ if eq(parameters.deploymentEnvironment, 'prod') }}:
        webjobsStorageAccountName: 'stgwclamloprod001'
        webjobsStorageAccountResourceGroup: 'rg-azugwc-90012-sa-prod-001'
        globalKeyVaultName: 'kvgwcuipathprod001'
        globalKeyVaultResourceGroup: 'rg-azugwc-90012-kv-prod-001'
        localKeyVaultName: 'kvgwclamloprod001'
        localKeyVaultResourceGroup: 'rg-azugwc-90012-kv-prod-001'

# ==========================================
#  Stage 6: Create Pull Request
# ==========================================
- stage: CreatePullRequest
  displayName: 'Create Pull Request to staging'
  dependsOn:
    - Validate
    - AppDeployment
  condition: succeeded()
  variables:
    - group: VFGTVOIS-CDK
    - name: generatedBranch
      value: $[ stageDependencies.Validate.GenerateTfvars.outputs['pushTfvarsBranch.generatedBranch'] ]
  jobs:
    - job: RaisePullRequest
      displayName: 'Raise GitHub Pull Request'
      steps:
        - template: templates/pullrequest.yml
          parameters:
            SourceBranch: '$(generatedBranch)'
            TargetBranch: 'staging'
            PullRequestBody: 'Generated by Azure Pipeline build $(Build.BuildNumber) after successful infrastructure and function deployment.'
